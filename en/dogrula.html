<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#111715" />
  <title>Lexote</title>
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=r09" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=r09" />
  <script>
    // E-posta doğrulama sayfası — yalnızca Lexote'nin gönderdiği doğrulama
    // bağlantısıyla açılır. Bağlantı yoksa ya da biçimi tutmuyorsa hiçbir şey
    // göstermeden ana sayfaya gider. Tek kullanımlık kod okunur okunmaz adres
    // çubuğundan silinir (yenileme / paylaşma / yer imi → ana sayfa).
    (function () {
      var p = new URLSearchParams(location.search)
      var token = /^[A-Za-z0-9_-]{20,200}$/
      var code = p.get('oobCode') || ''
      var key = p.get('apiKey') || ''
      if (p.get('mode') !== 'verifyEmail' || !token.test(code) || !token.test(key)) {
        location.replace(location.pathname.indexOf('/en/') === 0 ? '/en/' : '/')
        return
      }
      var lang = p.get('lang')
      window.__lexoteVerify = { code: code, key: key, lang: lang === 'en' || (lang !== 'tr' && location.pathname.indexOf('/en/') === 0) ? 'en' : 'tr' }
      history.replaceState(null, '', location.pathname)
    })()
  </script>
  <style>
    :root { --bg: #111715; --card: #1e2b27; --text: #e8f2f0; --muted: #7a9e96; --gold: #c9a84c; --danger: #e53935; --primary: #245b52; --primary-hover: #2e7066; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); }
    body { min-height: 100vh; color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: flex; justify-content: center; }
    main { width: 100%; max-width: 440px; padding: 72px 24px 48px; visibility: hidden; }
    main.ready { visibility: visible; }
    .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 56px; }
    .language-switch { display: flex; justify-content: flex-end; gap: 4px; margin-bottom: 24px; }
    .language-switch button { min-width: 44px; min-height: 44px; border: 1px solid #2a3632; border-radius: 8px; background: transparent; color: var(--muted); font: 600 13px system-ui; cursor: pointer; }
    .language-switch button[aria-pressed="true"] { color: var(--gold); background: var(--card); }
    .language-switch button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--card); display: inline-flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; font-size: 18px; color: var(--gold); }
    .name { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; letter-spacing: 1.5px; }
    .rule { width: 20px; height: 2px; border-radius: 1px; background: var(--gold); margin-bottom: 18px; }
    .rule.bad { background: var(--danger); }
    h1 { font-size: 24px; line-height: 1.3; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 16px; line-height: 1.6; color: var(--muted); margin-bottom: 32px; }
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: var(--primary); color: var(--text); font: inherit; font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .btn:hover { background: var(--primary-hover); }
    .btn[hidden] { display: none; }
    .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #2a3632; border-top-color: var(--gold); animation: spin .9s linear infinite; }
    .spinner[hidden] { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main id="main" aria-live="polite">
    <nav class="language-switch" aria-label="Language / Dil">
      <button type="button" lang="tr" data-verify-language="tr" aria-pressed="true">TR</button>
      <button type="button" lang="en" data-verify-language="en" aria-pressed="false">EN</button>
    </nav>
    <div class="brand"><span class="mark" aria-hidden="true">L</span><span class="name">Lexote</span></div>
    <div class="rule" id="rule"></div>
    <h1 id="title"></h1>
    <p id="body"></p>
    <div class="spinner" id="spinner" role="status"></div>
    <a class="btn" id="open" href="lexote://" hidden></a>
    <button class="btn" id="retry" type="button" hidden></button>
  </main>
  <script>
    (function () {
      var v = window.__lexoteVerify
      if (!v) return
      var COPY = {
        tr: {
          loadingTitle: 'E-posta adresiniz doğrulanıyor',
          loadingBody: 'Lütfen bekleyin.',
          doneTitle: 'E-posta adresiniz doğrulandı',
          doneBody: 'Hesabınız etkinleştirildi. Lexote uygulamasına dönerek kullanmaya başlayabilirsiniz.',
          invalidTitle: 'Bağlantı geçersiz',
          invalidBody: 'Bu doğrulama bağlantısının süresi dolmuş ya da daha önce kullanılmış. Uygulamadaki doğrulama ekranından yeni bir bağlantı isteyebilirsiniz.',
          errorTitle: 'Doğrulama tamamlanamadı',
          errorBody: 'Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.',
          open: "Lexote'yi aç",
          retry: 'Tekrar dene'
        },
        en: {
          loadingTitle: 'Verifying your email address',
          loadingBody: 'Please wait.',
          doneTitle: 'Your email address has been verified',
          doneBody: 'Your account is now active. Return to the Lexote app to start using it.',
          invalidTitle: 'This link is not valid',
          invalidBody: 'This verification link has expired or has already been used. You can request a new link from the verification screen in the app.',
          errorTitle: 'Verification could not be completed',
          errorBody: 'The server could not be reached. Please check your internet connection and try again.',
          open: 'Open Lexote',
          retry: 'Try again'
        }
      }
      var t = COPY[v.lang]
      var $ = function (id) { return document.getElementById(id) }
      var currentState = 'loading'

      function updateLanguage() {
        t = COPY[v.lang]
        document.documentElement.lang = v.lang
        $('open').textContent = t.open
        $('retry').textContent = t.retry
        document.querySelectorAll('[data-verify-language]').forEach(function (button) {
          button.setAttribute('aria-pressed', String(button.getAttribute('data-verify-language') === v.lang))
        })
      }
      document.querySelectorAll('[data-verify-language]').forEach(function (button) {
        button.addEventListener('click', function () {
          v.lang = button.getAttribute('data-verify-language')
          updateLanguage()
          show(currentState)
        })
      })
      updateLanguage()

      function show(state) {
        currentState = state
        $('title').textContent = t[state + 'Title']
        $('body').textContent = t[state + 'Body']
        $('rule').className = state === 'invalid' || state === 'error' ? 'rule bad' : 'rule'
        $('spinner').hidden = state !== 'loading'
        $('open').hidden = state !== 'done' && state !== 'invalid'
        $('retry').hidden = state !== 'error'
        $('main').className = 'ready'
      }

      function verify() {
        show('loading')
        fetch('https://identitytoolkit.googleapis.com/v1/accounts:update?key=' + encodeURIComponent(v.key), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ oobCode: v.code }),
          referrerPolicy: 'strict-origin'
        })
          .then(function (res) {
            if (res.ok) return show('done')
            return res.json().then(function (json) {
              var msg = (json && json.error && json.error.message) || ''
              show(/OOB_CODE|USER_NOT_FOUND|USER_DISABLED/.test(msg) ? 'invalid' : 'error')
            }, function () { show('error') })
          })
          .catch(function () { show('error') })
      }

      $('retry').addEventListener('click', verify)
      verify()
    })()
  </script>
</body>
</html>
